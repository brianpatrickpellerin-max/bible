<script type="text/plain" id="wsrc">// index worker: builds the word index, Hebrew/Greek spelling index and root index off the main thread
const DC="bible-data";let POS=null,NTR=0,done=0,ilDone=false,finished=false,lastSnap=-1;const A=new Map(),SNAPS=new Set([1,2,5,8,11,14,17]);

  if(!r){r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);}return unpack(new Uint8Array(await r.arrayBuffer()));}

  while(i<a.length||j<b.length){const v=(j>=b.length||(i<a.length&&a[i]<=b[j]))?a[i++]:b[j++];if(v!==last){o[k++]=v;last=v;}}return o.slice(0,k);}

    for(const w of tk){if(seen.has(w))continue;seen.add(w);let p=P.get(w);if(!p){p=[];P.set(w,p);}p.push(i);}}
  for(const [w,p] of P){const b=Int32Array.from(p).sort();const a=A.get(w);A.set(w,a?merge(a,b):merge(new Int32Array(0),b));}
  done++;if(SNAPS.has(done)&&done<NTR)snap();}
function pack(map,type,extra){const words=[...map.keys()];const off=new Uint32Array(words.length+1);let tot=0;words.forEach((w,k)=>{off[k]=tot;tot+=map.get(w).length;});off[words.length]=tot;
  const post=new Int32Array(tot);words.forEach((w,k)=>post.set(map.get(w),off[k]));postMessage(Object.assign({type,words,off,post},extra||{}),[off.buffer,post.buffer]);}

function showChapter(ref,tn,tn2){

  html+=`<div class="acts"><button class="alt" data-say="ch" data-lab="🔊 Listen">🔊 Listen</button><button class="alt" id="rmode">📖 Reading mode</button></div><div class="ctext" style="margin-top:10px">`;
  for(const r of refs){const t=DATA.tr[tn][r]||"";const t2=tn2?(DATA.tr[tn2][r]||""):"";if(!t&&!t2)continue;
    html+=`<p data-go="${r}" class="${r===ref?"cur":""}${hlClass(r)}"><sup>${r.split(":")[1]}</sup>${esc(t)}${tn2?`<span class="cmp"><span class="tr">${NAMES[tn2]||tn2}</span> ${esc(t2||"(not in this translation)")}</span>`:""}</p>`;}

let SPEAKING=false;
function stopSpeak(){if(window.speechSynthesis)speechSynthesis.cancel();SPEAKING=false;document.querySelectorAll("[data-say]").forEach(b=>b.textContent=b.dataset.lab);}
function speak(parts,btn){if(!window.speechSynthesis){toast("Read aloud isn't available here");return;}
  if(SPEAKING){stopSpeak();return;}
  speechSynthesis.cancel();SPEAKING=true;btn.textContent="■ Stop";
  const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en[-_](CA|US|GB)/i.test(v.lang)&&/enhanced|premium/i.test(v.name))||vs.find(v=>/en[-_]CA/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
  parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);if(v)u.voice=v;u.rate=.95;if(i===parts.length-1)u.onend=()=>stopSpeak();speechSynthesis.speak(u);});}
function sayText(t){return t.replace(/^[\u05D0-\u05EA]\s+[A-Z]+\.\s*|^\[?[A-Z]{3,}\.\]?\s*/,"");}
async function backup(){const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("bl_"))data[k]=localStorage.getItem(k);}
  const d=new Date();const name=`bible-lookup-backup-${dkey(d)}.json`;
  const blob=new Blob([JSON.stringify({app:"bible-lookup",saved:d.toISOString(),data},null,1)],{type:"application/json"});
  const file=new File([blob],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast("Backup saved");}

// ---- share as image
function refName(r){const b=bookOf(r);return (FULL[b]||b)+" "+r.slice(b.length+1);}
function wrapLines(x,text,W){const out=[];let line="";for(const w of text.split(" ")){const t=line?line+" "+w:w;if(x.measureText(t).width>W&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}
function drawCard(r,n){const c=document.createElement("canvas");c.width=1080;c.height=1080;const x=c.getContext("2d");
  const SERIF='ui-serif, "New York", Georgia, "Times New Roman", "Liberation Serif", serif',SANS='-apple-system, "Helvetica Neue", Arial, sans-serif';
  x.fillStyle="#ece6d8";x.fillRect(0,0,1080,1080);
  x.save();x.shadowColor="rgba(60,50,30,.18)";x.shadowBlur=36;x.shadowOffsetY=10;x.fillStyle="#fffdf8";
  x.beginPath();if(x.roundRect)x.roundRect(64,64,952,952,40);else x.rect(64,64,952,952);x.fill();x.restore();
  x.fillStyle="#3d4a34";x.fillRect(500,150,80,6);
  const text="“"+sayText(DATA.tr[n][r]||"").replace(/\s+/g," ").trim()+"”";
  const W=800,top=200,bottom=800;let fs=70,lines=[],lh=0;
  for(;fs>=22;fs-=2){x.font=`${fs}px ${SERIF}`;lh=Math.round(fs*1.4);lines=wrapLines(x,text,W);if(lines.length*lh<=bottom-top)break;}
  let y=top+(bottom-top-lines.length*lh)/2+fs*1.02;
  x.fillStyle="#1f1c17";x.textAlign="center";x.textBaseline="alphabetic";
  for(const l of lines){x.fillText(l,540,y);y+=lh;}
  x.fillStyle="#3d4a34";x.font=`bold 48px ${SERIF}`;x.fillText(refName(r),540,880);
  x.fillStyle="#8a8375";x.font=`30px ${SANS}`;x.fillText(NAMES[n]||n,540,932);
  return c;}

  const draw=()=>{const c=drawCard(r,n);$("shimg").src=c.toDataURL("image/png");SHARE=null;c.toBlob(b=>{if(b)SHARE=new File([b],`${r.replace(/[ :]+/g,"-")}.png`,{type:"image/png"});},"image/png");};

function card(r,best,qw){
  const H=hls();
  let html=`<div class="card vcard${hlClass(r)}"><div class="ref">${r}${best?" · best match":""}</div>`+
  `<div class="acts"><button class="alt" data-fav="${r}">${favs().includes(r)?"★ Saved":"☆ Save"}</button><button class="alt" data-note="${r}">✎ Note</button><button class="alt" data-hl="${r}">🖍 Colour</button><button class="alt" data-say="${r}" data-lab="🔊 Listen">🔊 Listen</button><button class="alt" data-chap="${r}">Chapter</button><button class="alt" data-copy="${r}">Copy</button><button class="alt" data-img="${r}">Share image</button></div>`+
  `<div class="hlrow" style="display:none">${Object.keys(HLC).map(c=>`<button class="sw ${c}${H[r]===c?" on":""}" data-hc="${c}" data-r="${r}" aria-label="${HLC[c]}" title="${HLC[c]}"></button>`).join("")}<button class="alt" data-hc="" data-r="${r}">Clear</button></div>`;
  for(const n of shown()){const t=DATA.tr[n][r]; if(!t) continue; html+=`<div class="tr">${NAMES[n]||n}</div><div>${highlight(t,qw)}</div>`;}
  const miss=shown().filter(n=>!LOADED.has(n)&&!FAILED.has(n)).length;
  if(miss) html+=`<div class="tr">${miss} more translation${miss>1?"s":""} still loading…</div>`;
  const nt=notes()[r];
  html+=`<div class="note" id="note-${r.replace(/\W/g,"_")}" style="${nt?"":"display:none"}"><div class="tr">My note</div><textarea data-nr="${r}" placeholder="Write a note about this verse…">${esc(nt||"")}</textarea></div>`;
  const il=DATA.il[r]||[];
  if(il.length){html+=`<div class="tr">Hebrew / Greek (tap a word)</div><div class="il">`;
    il.forEach(x=>{const i=CUR.length;CUR.push(x);html+=`<span class="w" data-i="${i}">${esc(x[0])}<span class="g">${esc(x[1])}</span></span>`;});html+=`</div>`;}
  else if(!LOADED.has("il")&&!FAILED.has("il")) html+=`<div class="tr">Hebrew / Greek still loading…</div>`;

  return html+`</div>`;
}
let LASTCARD=null;
function show(ref,ctx,noPush){
  stopSpeak(); setView({t:"verse",ref});
  ctx=ctx||{qw:[],list:[[ref,null]]}; LAST={...ctx,ref};
  if(!noPush){try{history.pushState({ref},"","#"+encodeURIComponent(ref));}catch(e){}}
  hidePop(); CUR=[]; LASTCARD=ref;
  const out=$("out");
  const prev=step(ref,-1), next=step(ref,1);
  let html="";
  if(ctx.q&&!ctx.isRef&&ctx.fl&&ctx.fl.t!=="all") html+=`<div class="fchip"><span>Searching only <b>${esc(filterName(ctx.fl))}</b></span><button class="alt" data-clrf="1">✕ Clear filter</button></div>`;
  html+=`<div class="bar"><button class="alt" ${prev?`data-go="${prev}"`:"disabled"}>◀ Previous verse</button><button class="alt" ${next?`data-go="${next}"`:"disabled"}>Next verse ▶</button></div>`;
  const isBest=ctx.qw.length>0&&ctx.list&&ctx.list[0]&&ctx.list[0][0]===ref;
  html+=card(ref,isBest,ctx.qw);
  const mini=(r,lab)=>{if(!r)return "";return `<a href="#" data-go="${r}"><small>${lab}</small> <b>${r}</b><br><small>${esc(textOf(r)||"")}</small></a>`;};
  if(prev||next) html+=`<div class="card more"><div class="ref">Around this verse</div>${mini(prev,"Before")}${mini(next,"After")}</div>`;
  const others=(ctx.list||[]).filter(x=>x[0]!==ref);
  if(ctx.orig){
    html+=`<div class="card more"><div class="ref">${esc(ctx.orig)} appears in ${ctx.total} verse${ctx.total===1?"":"s"}${ctx.allTotal&&ctx.allTotal!==ctx.total?` <small>(${ctx.allTotal} in the whole Bible)</small>`:""}</div>`;
    if(ctx.root) html+=`<div class="row" style="margin:6px 0 8px"><button data-study="${ctx.root}">📊 Word study</button></div>`;
    for(const [r] of others.slice(0,200)){const t=textOf(r)||"";html+=`<a href="#" data-go="${r}"><b>${r}</b><br><small>${esc(t.length>110?t.slice(0,110)+"…":t)}</small></a>`;}
    if(ctx.total>201) html+=`<div class="tr">Showing the first 200.</div>`;
    html+=`</div>`;
  } else if(others.length&&ctx.qw.length){
    html+=`<div class="card more"><div class="ref">Other matches</div>`;
    for(const [r,s] of others.slice(0,7)){const t=textOf(r)||"";
      html+=`<a href="#" data-go="${r}"><b>${r}</b> <small>${s} of ${ctx.qw.length} words</small><br><small>${esc(t.length>110?t.slice(0,110)+"…":t)}</small></a>`;}
    html+=`</div>`;
  }
  const how=ctx.root?"Found every form of this root word.":ctx.orig?"Found by Hebrew or Greek spelling.":ctx.qw.length?`Best match has ${ctx.list[0][1]} of ${ctx.qw.length} words.`:"Opened by reference.";
  const part=ctx.qw.length&&ctx.nTr&&ctx.nTr<DATA.order.length?` Searched ${ctx.nTr} of ${DATA.order.length} translations while the rest were loading; search again for full results.`:"";
  html+=`<div class="card"><nav>${how}${part} Showing ${shown().length} of ${DATA.order.length} translations. Swipe left or right for the next or previous verse.</nav></div>`;
  out.innerHTML=html;
  out.querySelectorAll("[data-go]").forEach(el=>el.onclick=e=>{e.preventDefault();show(el.dataset.go,LAST);});
  out.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>copyVerse(el.dataset.copy));
  out.querySelectorAll("[data-fav]").forEach(el=>el.onclick=()=>{toggleFav(el.dataset.fav);el.textContent=favs().includes(el.dataset.fav)?"★ Saved":"☆ Save";});
  out.querySelectorAll("[data-chap]").forEach(el=>el.onclick=()=>showChapter(el.dataset.chap,localStorage.getItem("bl_chtr")));
  out.querySelectorAll("[data-img]").forEach(el=>el.onclick=()=>openShare(el.dataset.img));
  out.querySelectorAll("[data-hl]").forEach(el=>el.onclick=()=>{const row=el.closest(".card").querySelector(".hlrow");row.style.display=row.style.display==="none"?"flex":"none";});
  out.querySelectorAll("[data-hc]").forEach(el=>el.onclick=()=>{const r=el.dataset.r,c=el.dataset.hc;setHl(r,c);const cd=el.closest(".card");cd.className="card vcard"+hlClass(r);
    cd.querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s.dataset.hc===c));toast(c?`Highlighted ${r} ${HLC[c].toLowerCase()}`:"Highlight cleared");});

  out.querySelectorAll("textarea[data-nr]").forEach(el=>{el.oninput=()=>setNote(el.dataset.nr,el.value);el.onblur=()=>{if(el.value.trim())toast("Note saved");};});
  window.scrollTo(0,0);

  let html=`<div class="card votd${hlClass(r)}"><div class="tr" style="margin-top:0">Verse of the day · ${esc(date)}</div><div class="ref" style="margin-top:4px">${esc(refName(r))}</div><div class="vt">${esc(sayText(t))}</div><div class="tr">${esc(NAMES[n]||n||"")}</div>
  <div class="acts"><button data-vopen="1">Open</button><button class="alt" data-vsave="1">${favs().includes(r)?"★ Saved":"☆ Save"}</button><button class="alt" data-img="${r}">Share image</button></div></div>`;
  html+=`<div class="card"><nav>Search with the box at the bottom, or tap Books, Reading plan or Random. Filter lets you search just the Old or New Testament, or one book.</nav></div>`;
  const out=$("out");out.innerHTML=html;
  out.querySelector("[data-vopen]").onclick=()=>{$("q").value=r;show(r);};
  out.querySelector("[data-vsave]").onclick=e=>{toggleFav(r);e.target.textContent=favs().includes(r)?"★ Saved":"☆ Save";};
  out.querySelector("[data-img]").onclick=()=>openShare(r);
  showRemind();window.scrollTo(0,0);}
$("home").onclick=()=>showHome(true);$("homeb").onclick=()=>showHome(true);
// ---- search
async function render(q){
  const out=$("out");q=(q||"").trim();if(!q)return;
  $("fpanel").style.display="none";
  out.innerHTML="<div class='card'>Searching…</div>";
  if(needsIl(q)&&!await needIl())return;
  await ensureIdx(q);
  await new Promise(r=>setTimeout(r,20));
  const fl=getFilter();const res=search(q,fl);res.q=q;res.fl=fl;res.nTr=INDEX?INDEXNTR:trLoaded().length;
  if(!res.list.length){setView({t:"none"});
    out.innerHTML=`<div class='card'>${res.bad?"That reference isn't in the Bible. Check the book, chapter and verse.":fl.t!=="all"?`No verse found in ${esc(filterName(fl))}.`:"No verse found."}</div>`+(fl.t!=="all"&&!res.bad?`<div class="row" style="margin:0 12px"><button data-clrf="1">Search the whole Bible</button></div>`:"");
    const cf=out.querySelector("[data-clrf]");if(cf)cf.onclick=()=>{setFilter({t:"all"});render(q);};return;}
  saveRecent(q); show(res.list[0][0],res);
}
function showPop(i,el){
  document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on")); el.classList.add("on");
  const [w,g,gray,m,sn]=CUR[i]; const p=$("pop"); const lx=sn?((DATA.lex||{})[sn]||""):"";
  p.innerHTML=`<button class="alt x" id="closepop" aria-label="Close">✕</button><div class="heb">${esc(w)}</div><div style="color:#2f6b3a">${esc(g||"—")}</div>`+
    `<div class="lbl">Other meanings</div><div class="gray">${esc(gray||"none listed")}</div>`+
    `<div class="lbl">Parsing</div><div class="morph">${esc(m||"—")}</div>`+
    (sn?`<div class="lbl">Root word</div><div class="gray">${esc(lx||sn)} <small>(${sn})</small></div>`:"")+
    `<div class="row">${sn?`<button id="findr">Every verse with this root</button><button id="study">📊 Word study</button>`:""}<button class="alt" id="findw">This exact spelling</button></div>`;
  $("findw").onclick=()=>{$("q").value=w;render(w);};
  if(sn){$("findr").onclick=()=>{const q="root "+sn;$("q").value=q;render(q);};$("study").onclick=()=>showStudy(sn);}
  p.style.display="block";p.scrollTop=0;
  $("closepop").onclick=hidePop;
}
function hidePop(){$("pop").style.display="none";document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));}
function getRecent(){return jget("bl_recent",[]);}
function saveRecent(q){q=q.trim(); if(!q) return; let r=getRecent().filter(x=>x!==q); r.unshift(q); r=r.slice(0,8); jset("bl_recent",r); showRecent();}
function showRecent(){const r=getRecent(); const el=$("recent"); if(!r.length){el.innerHTML="";return;} el.innerHTML="Recent: "+r.map((x,i)=>`<a href="#" data-i="${i}">${esc(x)}</a>`).join(""); el.querySelectorAll("a").forEach(a=>a.onclick=(e)=>{e.preventDefault(); const v=getRecent()[+a.dataset.i]; $("q").value=v; render(v);});}
function setFs(px){px=Math.max(14,Math.min(30,px)); document.documentElement.style.setProperty("--fs",px+"px"); try{localStorage.setItem("bl_fs",px);}catch(e){}}
setFs(+(localStorage.getItem("bl_fs")||18));
const curFs=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"));
$("minus").onclick=()=>setFs(curFs()-2);
$("plus").onclick=()=>setFs(curFs()+2);
$("go2").onclick=()=>{$("q").blur();render($("q").value);};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.target.blur();render(e.target.value);}});
document.addEventListener("keydown",e=>{if(e.target.id==="q"||!VIEW||VIEW.t!=="verse")return;if(e.key==="ArrowLeft"){const p=step(VIEW.ref,-1);if(p)show(p,LAST);}if(e.key==="ArrowRight"){const n=step(VIEW.ref,1);if(n)show(n,LAST);}});
(()=>{let sx=0,sy=0,st=0;const o=$("out");
  o.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
  o.addEventListener("touchend",e=>{if(!VIEW||!st)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;st=0;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;if(e.target.closest&&e.target.closest("textarea,select,.scroll"))return;
    const d=dx<0?1:-1;
    if(VIEW.t==="verse"){const r=step(VIEW.ref,d);if(r){show(r,LAST);toast(r);}}
    else if(VIEW.t==="chapter"){const m=chapterOf(VIEW.ref).match(/^(.*) (\d+)$/);const r=`${m[1]} ${+m[2]+d}:1`;if(hasRef(r)){showChapter(r,VIEW.tn,VIEW.tn2);window.scrollTo(0,0);}}
  },{passive:true});})();
// ---- background loading
function note(t){const e=$("loadnote");e.textContent=t;e.style.display=t?"block":"none";document.body.classList.toggle("loading",!!t);}
function progress(){const n=trLoaded().length,N=DATA.order.length;note(n<N||!LOADED.has("il")?`Loading the rest of the Bible… ${n} of ${N} translations`:"");}
function refreshMaybe(){if(!VIEW||SPEAKING)return;if($("pop").style.display==="block"||$("sheet").style.display==="flex")return;
  const ae=document.activeElement;if(ae&&/TEXTAREA|INPUT|SELECT/.test(ae.tagName))return;
  if(VIEW.t==="verse"){const y=window.scrollY;show(VIEW.ref,LAST,true);window.scrollTo(0,y);}else if(VIEW.t==="home")showHome();}
let FAILNOTE=false;
HOOK=(k,d)=>{
  if(k==="idx"){idxMsg(d);return;}
  if(k==="fail"){note("");if(!FAILNOTE){FAILNOTE=true;toast("Part of the Bible couldn't download. Open the page again when you're online.");}return;}
  if(k==="done"){note("");window.__blAll=true;idleBuild();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}refreshMaybe();return;}
  if(IWFAIL){if(DATA.order.includes(k)){INDEX=null;delete BST.w;FCACHE.clear();XCACHE.clear();}if(k==="il"){OINDEX=null;RINDEX=null;delete BST.o;delete BST.r;}}
  progress();if(k==="il")refreshMaybe();
};
if(localStorage.getItem("bl_dark")==="1"&&!localStorage.getItem("bl_theme"))localStorage.setItem("bl_theme","dark");
applyTheme();filterLabel();showRecent();
window.addEventListener("popstate",e=>{const r=(e.state&&e.state.ref)||decodeURIComponent(location.hash.slice(1));if(r&&hasRef(r))show(r,LAST&&LAST.list&&LAST.list.some(x=>x[0]===r)?LAST:undefined,true);else if(!r)showHome();});
const startRef=decodeURIComponent(location.hash.slice(1));
if(startRef&&hasRef(startRef)){$("q").value=startRef;show(startRef,undefined,true);} else showHome();
if(FILES)progress();
while(IWQ.length)idxMsg(IWQ.shift());
if(!FILES){window.__blAll=true;idleBuild();}
window.BL={showStudy,votdRef,getLast:()=>LAST,view:()=>VIEW,streaks,idx:()=>({worker:!IWFAIL,done:IWDONE,ntr:INDEXNTR,o:!!OINDEX,r:!!RINDEX})};
window.__blReady=true;
}
</script>
