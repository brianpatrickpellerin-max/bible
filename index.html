function show(ref,ctx,noPush,keepScroll){

  const back=VIEW&&VIEW.t==="verse"?{ref:VIEW.ref,ctx:LAST}:null;
  await waitIdx(()=>RINDEX,30000);setView({t:"study",code});if(!RINDEX)buildRIndex();
  const vs=RINDEX.get(code)||[];let occ=0;const books=new Map(),gl=new Map(),sp=new Map();
  for(const i of vs){const r=ORDERREFS[i];for(const x of DATA.il[r]||[])if(x[4]===code){occ++;const b=REFBOOK[i];books.set(b,(books.get(b)||0)+1);
    const g0=(x[1]||"").trim()||"—",g=g0.toLowerCase();let e=gl.get(g);if(!e){e={n:0,v:[],d:g0};gl.set(g,e);}e.n++;if(e.v[e.v.length-1]!==i)e.v.push(i);
    const w=x[0].replace(/[־׃,.;·]/g,"");sp.set(w,(sp.get(w)||0)+1);}}
  const lx=(DATA.lex||{})[code]||"";const topB=[...books].sort((a,b)=>b[1]-a[1]||BOOKLIST.indexOf(a[0])-BOOKLIST.indexOf(b[0]));const max=topB.length?topB[0][1]:1;
  const spell=[...sp].sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);const G=[...gl].sort((a,b)=>b[1].n-a[1].n);
  const ot=topB.filter(b=>OTSET.has(b[0])).reduce((s,b)=>s+b[1],0);
  let html=`<div class="bar">${back?`<button class="alt" data-sback="1">◀ Back</button>`:""}<button class="alt" data-sall="1">Every verse</button></div>`;
  html+=`<div class="card"><div class="tr" style="margin-top:0">Word study · ${code}</div><div style="font-size:1.6em;margin-top:4px">${esc(spell.join(" · ")||code)}</div>${lx?`<div style="margin-top:4px">${esc(lx)}</div>`:""}
  <div class="stat"><div><b>${occ}</b>times</div><div><b>${vs.length}</b>verses</div><div><b>${books.size}</b>books</div></div>
  <div class="tr">${ot&&ot<occ?`${ot} in the Old Testament, ${occ-ot} in the New`:ot?"Old Testament only":"New Testament only"}</div></div>`;
  html+=`<div class="card"><div class="ref">Where it's used most</div><div class="bars">${topB.slice(0,12).map(([b,n])=>`<div class="barrow"><span class="bl">${esc(FULL[b]||b)}</span><span class="bt"><div style="width:${Math.max(3,n/max*100).toFixed(1)}%"></div></span><span class="bn">${n}</span></div>`).join("")}</div>${topB.length>12?`<div class="tr">…and ${topB.length-12} more book${topB.length-12>1?"s":""}</div>`:""}</div>`;
  html+=`<div class="card"><div class="ref">How it's translated (${G.length} English word${G.length===1?"":"s"})</div><div class="tr" style="margin-top:2px">The green words used for it in the interlinear. Tap one to see those verses.</div><div class="glist">${G.map(([g,e],k)=>`<a href="#" data-gk="${k}"><span>${esc(e.d)}</span><small>${e.n}× · ${e.v.length} verse${e.v.length>1?"s":""}</small></a>`).join("")}</div></div>`;
  const out=$("out");out.innerHTML=html;
  out.querySelectorAll("[data-gk]").forEach(el=>el.onclick=e=>{e.preventDefault();const en=G[+el.dataset.gk][1],g=en.d;const list=en.v.map(i=>[ORDERREFS[i],null]);
    show(list[0][0],{list,qw:[],orig:`“${g}” (${code})`,root:code,total:list.length});});
  const sb=out.querySelector("[data-sback]");if(sb)sb.onclick=()=>show(back.ref,back.ctx,true);
  out.querySelector("[data-sall]").onclick=()=>{const q="root "+code;$("q").value=q;render(q);};
  window.scrollTo(0,0);}
// ---- home
const EXAMPLES=["Psalm 23","John 3:16","love your enemies","ἀγάπη","שָׁלוֹם"];
function showHome(push){setView({t:"home"});hidePop();LAST=null;
  if(push){try{history.pushState({home:1},"",location.pathname+location.search);}catch(e){}}
  let html=`<div class="card"><div>Type a phrase, a verse like Psalm 23, or a Hebrew or Greek word in the box below. Try one:</div><div class="ex">${EXAMPLES.map((x,i)=>`<button class="alt" data-ex="${i}">${esc(x)}</button>`).join("")}</div>
  <div class="tr">On a verse, tap a Hebrew or Greek word to see what it means.</div></div>`;
  const out=$("out");out.innerHTML=html;
  out.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const q=EXAMPLES[+b.dataset.ex];$("q").value=q;render(q);});
  window.scrollTo(0,0);}
$("home").onclick=()=>showHome(true);$("homeb").onclick=()=>showHome(true);
// ---- search
async function render(q,noPush){
  const out=$("out");q=(q||"").trim();if(!q)return;
  out.innerHTML="<div class='card'>Searching…</div>";
  const pq=phraseQuery(q);
  if(pq.quoted&&!ORIG.test(pq.inner)&&!/^(?:root\s*)?[HG]\d{1,5}$/i.test(pq.inner)){
    if(!pq.words.length){out.innerHTML="<div class='card'>Type some words between the quotes.</div>";return;}
    await new Promise(r=>setTimeout(r,20));await ensurePh(phTr());saveRecent(q);showPhrase(q,pq.words,0,noPush);return;}
  if(pq.quoted)q=pq.inner;
  if(needsIl(q)&&!await needIl())return;
  await ensureIdx(q);
  await new Promise(r=>setTimeout(r,20));
  const fl=getFilter();const res=search(q,fl);res.q=q;res.fl=fl;res.nTr=INDEX?INDEXNTR:trLoaded().length;
  const usePh=!res.isRef&&!res.orig&&!res.bad&&pq.words.length>=2;
  if(usePh){await ensurePh(phTr());res.phr=pq.words;
    if(!res.list.length){saveRecent(q);showPhrase(q,pq.words,0,noPush);return;}}
  if(!res.list.length){setView({t:"none"});
    out.innerHTML=`<div class='card'>${res.bad?"That reference isn't in the Bible. Check the book, chapter and verse.":fl.t!=="all"?`No verse found in ${esc(filterName(fl))}.`:"No verse found."}</div>`+(fl.t!=="all"&&!res.bad?`<div class="row" style="margin:0 12px"><button data-clrf="1">Search the whole Bible</button></div>`:"");
    const cf=out.querySelector("[data-clrf]");if(cf)cf.onclick=()=>{setFilter({t:"all"});render(q);};return;}
  saveRecent(q); show(res.list[0][0],res,noPush);
}
function showPop(i,el){
  document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on")); el.classList.add("on");
  const [w,g,gray,m,sn]=CUR[i]; const p=$("pop"); const lx=sn?((DATA.lex||{})[sn]||""):"";
  p.innerHTML=`<button class="alt x" id="closepop" aria-label="Close">✕</button><div class="heb">${esc(w)}</div><div class="gl">${esc(g||"—")}</div>`+
    `<div class="lbl">Other meanings</div><div class="gray">${esc(gray||"none listed")}</div>`+
    `<div class="lbl">Parsing</div><div class="morph">${esc(m||"—")}</div>`+
    (sn?`<div class="lbl">Root word</div><div class="gray">${esc(lx||sn)} <small>(${sn})</small></div>`:"")+
    `<div class="row">${sn?`<button id="study">Word study</button><button class="alt" id="findr">Verses with this root</button>`:""}<button class="alt" id="findw">Same spelling</button></div>`;
  $("findw").onclick=()=>{$("q").value=w;render(w);};
  if(sn){$("findr").onclick=()=>{const q="root "+sn;$("q").value=q;render(q);};$("study").onclick=()=>showStudy(sn);}
  p.style.display="block";p.scrollTop=0;
  $("closepop").onclick=hidePop;
}
function hidePop(){$("pop").style.display="none";document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));}
function getRecent(){return jget("bl_recent",[]);}
function saveRecent(q){q=q.trim(); if(!q) return; let r=getRecent().filter(x=>x!==q); r.unshift(q); r=r.slice(0,8); jset("bl_recent",r); showRecent();}
function showRecent(){const r=getRecent(); const el=$("recent"); if(!r.length){el.innerHTML="";return;} el.innerHTML="Recent: "+r.map((x,i)=>`<a href="#" data-i="${i}">${esc(x)}</a>`).join(""); el.querySelectorAll("a").forEach(a=>a.onclick=(e)=>{e.preventDefault(); const v=getRecent()[+a.dataset.i]; $("q").value=v; render(v);});}
function setFs(px){px=Math.max(14,Math.min(30,px)); document.documentElement.style.setProperty("--fs",px+"px"); try{localStorage.setItem("bl_fs",px);}catch(e){}}
setFs(+(localStorage.getItem("bl_fs")||18));
function curFs(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||18;}
$("go2").onclick=()=>{$("q").blur();render($("q").value);};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.target.blur();render(e.target.value);}});
document.addEventListener("keydown",e=>{if(e.target.id==="q"||!VIEW||VIEW.t!=="verse")return;if(e.key==="ArrowLeft"){const p=step(VIEW.ref,-1);if(p)show(p,LAST);}if(e.key==="ArrowRight"){const n=step(VIEW.ref,1);if(n)show(n,LAST);}});
(()=>{let sx=0,sy=0,st=0;const o=$("out");
  o.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
  o.addEventListener("touchend",e=>{if(!VIEW||!st)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;st=0;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;if(e.target.closest&&e.target.closest("select,#recent"))return;
    const d=dx<0?1:-1;
    if(VIEW.t==="verse"){const r=step(VIEW.ref,d);if(r){show(r,LAST);toast(r);}}
    else if(VIEW.t==="chapter"){const m=chapterOf(VIEW.ref).match(/^(.*) (\d+)$/);const r=`${m[1]} ${+m[2]+d}:1`;if(hasRef(r)){showChapter(r,VIEW.tn,VIEW.tn2);window.scrollTo(0,0);}}
  },{passive:true});})();
// ---- background loading
function note(t){const e=$("loadnote");e.textContent=t;e.style.display=t?"block":"none";document.body.classList.toggle("loading",!!t);}
function progress(){const n=trLoaded().length,N=DATA.order.length;note(n<N||!LOADED.has("il")?`Loading the rest of the Bible… ${n} of ${N} translations`:"");}
function refreshMaybe(){if(!VIEW)return;if($("pop").style.display==="block"||$("sheet").style.display==="flex")return;
  const ae=document.activeElement;if(ae&&/INPUT|SELECT/.test(ae.tagName))return;
  if(VIEW.t==="verse"){const y=window.scrollY;show(VIEW.ref,LAST,true,true);window.scrollTo(0,y);}}
let FAILNOTE=false;
HOOK=(k,d)=>{
  if(k==="idx"){idxMsg(d);return;}
  if(k==="fail"){note("");if(!FAILNOTE){FAILNOTE=true;toast("Part of the Bible couldn't download. Open the page again when you're online.");}return;}
  if(k==="done"){note("");window.__blAll=true;idleBuild();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}refreshMaybe();return;}
  if(IWFAIL){if(DATA.order.includes(k)){INDEX=null;delete BST.w;FCACHE.clear();XCACHE.clear();}if(k==="il"){OINDEX=null;RINDEX=null;delete BST.o;delete BST.r;}}
  if(k===phTr())phIdle(k);
  progress();if(k==="il")refreshMaybe();
};
applyTheme();filterLabel();showRecent();
window.addEventListener("popstate",e=>{const s=e.state||{};if(s.pq){$("q").value=s.pq;render(s.pq,true);return;}
  if(s.id&&CTXS.has(s.id)&&hasRef(s.ref)){show(s.ref,CTXS.get(s.id),true);return;}
  const r=s.ref||decodeURIComponent(location.hash.slice(1));if(r&&hasRef(r))show(r,LAST&&LAST.list&&LAST.list.some(x=>x[0]===r)?LAST:undefined,true);else if(!r)showHome();});
const startRef=decodeURIComponent(location.hash.slice(1));
if(startRef&&hasRef(startRef)){$("q").value=startRef;show(startRef,undefined,true);} else if(/^["“]/.test(startRef)){$("q").value=startRef;render(startRef,true);} else showHome();
if(FILES)progress();
while(IWQ.length)idxMsg(IWQ.shift());
phIdle(phTr());
if(!FILES){window.__blAll=true;idleBuild();}
window.BL={showStudy,ph:()=>Object.keys(PH),phraseHits:(n,q)=>{const w=phraseQuery(q).words;if(!PH[n])phStep(n,0);return phraseHits(n,w,{t:'all'}).ids.length;},getLast:()=>LAST,view:()=>VIEW,idx:()=>({worker:!IWFAIL,done:IWDONE,ntr:INDEXNTR,o:!!OINDEX,r:!!RINDEX})};
window.__blReady=true;
}
</script>
