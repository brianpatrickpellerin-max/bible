// ---- exact-phrase list (quiet centred lines; more load as you scroll)
function phBlock(words,quoted,keepN){const n=phTr(),fl=getFilter(),h=phraseHits(n,words,fl);
  PHS={words,quoted,tr:n,h,shown:Math.min(h.ids.length,Math.max(50,keepN||0))};
  const N=h.ids.length,label=`“${esc(words.join(" "))}”`;
  let html=`<div id="phl">`;
  if(!quoted&&!N)return `<div id="phl"><div class="sub" style="margin-top:56px">No verse has these exact words in ${esc(NAMES[n]||n)}.</div><div id="phrows"></div><div class="sentinel" id="phsent"></div></div>`;
  html+=quoted?`<div style="height:6vh"></div>`:`<div class="sec">Every verse with ${label}</div>`;
  html+=`<div class="sub">${N?`${N} verse${N===1?"":"s"}`:"No verse has these exact words"} in ${esc(NAMES[n]||n)}${N&&h.ot&&h.nt?`<br>Old Testament ${h.ot} · New Testament ${h.nt}`:""}${fl.t!=="all"?`<br>Searching only ${esc(filterName(fl))}${h.all!==N?` · ${h.all} in the whole Bible`:""}`:""}</div>`;
  html+=`<div id="phrows">${phRows(0,PHS.shown)}</div><div class="sentinel" id="phsent"></div></div>`;
  return html;}
function phRows(a,b){const T=DATA.tr[PHS.tr];let s="";for(let k=a;k<b;k++){const r=ORDERREFS[PHS.h.ids[k]];const mh=markPhrase(plainText(T[r]||""),PHS.words);s+=liHtml(r,PHS.tr==="HLIT"?nbh(mh):mh,`data-pgo="${r}"`);}return s;}
function phMoreTo(n){if(!PHS||!$("phrows"))return;const a=PHS.shown;PHS.shown=Math.min(PHS.h.ids.length,n);if(PHS.shown>a)$("phrows").insertAdjacentHTML("beforeend",phRows(a,PHS.shown));}
let PHIO=null;
function wirePh(){const s=$("phsent");if(!s)return;if(PHIO)PHIO.disconnect();
  if(window.IntersectionObserver){PHIO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&PHS&&PHS.shown<PHS.h.ids.length)phMoreTo(PHS.shown+50);},{rootMargin:"600px"});PHIO.observe(s);}}
window.addEventListener("scroll",()=>{if(!PHS||!$("phsent")||PHS.shown>=PHS.h.ids.length)return;if($("phsent").getBoundingClientRect().top<innerHeight+600)phMoreTo(PHS.shown+50);},{passive:true});
function openFromList(r){show(r,{qw:[],list:[[r,null]],openPhr:PHS?PHS.words:null});}
function showPhrase(q,words,keepN,noPush){setView({t:"phrase",q});LAST=null;
  if(!noPush){try{history.pushState({pq:q},"","#"+encodeURIComponent(q));}catch(e){}}
  $("out").innerHTML=phBlock(words,true,keepN);wirePh();window.scrollTo(0,0);}
// ---- word study
async function needIl(){if(LOADED.has("il"))return true;const out=$("out");out.innerHTML="<div class='msg'>Loading Hebrew and Greek…</div>";
  try{await waitFor("il");return true;}catch(e){out.innerHTML="<div class='msg'>The Hebrew and Greek part couldn't download. Connect to the internet and try again.</div>";return false;}}
async function showStudy(code){closeSheet();if(!await needIl())return;
  const back=VIEW&&VIEW.t==="verse"?{ref:VIEW.ref,ctx:LAST}:null;
  await waitIdx(()=>RINDEX,30000);setView({t:"study",code});if(!RINDEX)buildRIndex();
  const vs=RINDEX.get(code)||[];let occ=0;const books=new Map(),gl=new Map(),sp=new Map();
  for(const i of vs){const r=ORDERREFS[i];for(const x of DATA.il[r]||[])if(x[4]===code){occ++;const b=REFBOOK[i];books.set(b,(books.get(b)||0)+1);
    const g0=(x[1]||"").trim()||"—",g=g0.toLowerCase();let e=gl.get(g);if(!e){e={n:0,v:[],d:g0};gl.set(g,e);}e.n++;if(e.v[e.v.length-1]!==i)e.v.push(i);
    const w=x[0].replace(/[־׃,.;·]/g,"");sp.set(w,(sp.get(w)||0)+1);}}
  const lx=(DATA.lex||{})[code]||"";const topB=[...books].sort((a,b)=>b[1]-a[1]||BOOKLIST.indexOf(a[0])-BOOKLIST.indexOf(b[0]));const max=topB.length?topB[0][1]:1;
  const spell=[...sp].sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);const G=[...gl].sort((a,b)=>b[1].n-a[1].n);
  const ot=topB.filter(b=>OTSET.has(b[0])).reduce((s,b)=>s+b[1],0);
  let html=`<div class="study"><div class="sub" style="margin-top:4vh">Word study · ${code}</div><div class="big">${esc(spell.join(" · ")||code)}</div>${lx?`<div>${esc(lx)}</div>`:""}
  <div class="stat">${occ} times · ${vs.length} verses · ${books.size} books</div><div class="sub">${ot&&ot<occ?`${ot} in the Old Testament, ${occ-ot} in the New`:ot?"Old Testament only":"New Testament only"}</div>
  <a class="link" data-sall="1">Every verse with this root</a>${back?`<a class="link" data-sback="1">Back to ${esc(refName(back.ref))}</a>`:""}`;
  html+=`<div class="sec">Where it's used most</div>${topB.slice(0,12).map(([b,n])=>`<div class="barrow"><span class="bl">${esc(FULL[b]||b)}</span><span class="bt"><i style="width:${Math.max(3,n/max*100).toFixed(1)}%"></i></span><span class="bn">${n}</span></div>`).join("")}${topB.length>12?`<div class="sub" style="margin-top:10px">and ${topB.length-12} more book${topB.length-12>1?"s":""}</div>`:""}`;
  html+=`<div class="sec">How it's translated</div><div class="sub">${G.length} English word${G.length===1?"":"s"} in the interlinear</div>${G.map(([g,e],k)=>`<a class="li" data-gk="${k}"><span class="t">${esc(e.d)}</span><span class="r">${e.n} times · ${e.v.length} verse${e.v.length>1?"s":""}</span></a>`).join("")}</div>`;
  const out=$("out");out.innerHTML=html;
  out.querySelectorAll("[data-gk]").forEach(el=>el.onclick=e=>{e.preventDefault();const en=G[+el.dataset.gk][1],g=en.d;const list=en.v.map(i=>[ORDERREFS[i],null]);
    show(list[0][0],{list,qw:[],orig:`“${g}” · ${code}`,root:code,total:list.length});});
  const sb=out.querySelector("[data-sback]");if(sb)sb.onclick=()=>show(back.ref,back.ctx,true);
  out.querySelector("[data-sall]").onclick=()=>{const q="root "+code;$("q").value=q;render(q);};
  window.scrollTo(0,0);}
// ---- search
async function render(q,noPush){
  const out=$("out");q=(q||"").trim();if(!q)return;
  const cmd=q.toLowerCase();if(cmd==="settings"){settingsSheet();return;}if(cmd==="books"){bookSheet(b=>chapterSheet(b),"Books");return;}if(cmd==="translations"||cmd==="translation"){trSheet();return;}
  $("q").blur();
  setView({t:"busy"});out.innerHTML="<div class='msg'>Searching…</div>";
  const pq=phraseQuery(q);
  if(pq.quoted&&!ORIG.test(pq.inner)&&!/^(?:root\s*)?[HG]\d{1,5}$/i.test(pq.inner)){
    if(!pq.words.length){out.innerHTML="<div class='msg'>Type some words between the quotes.</div>";return;}
    await new Promise(r=>setTimeout(r,20));await ensurePh(phTr());saveRecent(q);showPhrase(q,pq.words,0,noPush);return;}
  if(pq.quoted)q=pq.inner;
  if(needsIl(q)&&!await needIl())return;
  await ensureIdx(q);
  await new Promise(r=>setTimeout(r,20));
  const fl=getFilter();const res=search(q,fl);res.q=q;res.fl=fl;res.nTr=INDEX?INDEXNTR:trLoaded().length;
  const usePh=!res.isRef&&!res.orig&&!res.bad&&pq.words.length>=2;
  if(usePh){await ensurePh(phTr());res.phr=pq.words;
    if(!res.list.length){saveRecent(q);showPhrase(q,pq.words,0,noPush);return;}}
  if(!res.list.length){setView({t:"none"});
    out.innerHTML=`<div class='msg'>${res.bad?"That reference isn't in the Bible.":fl.t!=="all"?`No verse found in ${esc(filterName(fl))}.`:"No verse found."}</div>`+(fl.t!=="all"&&!res.bad?`<a class="link" data-clrf="1">Search the whole Bible</a>`:"");
    const cf=out.querySelector("[data-clrf]");if(cf)cf.onclick=()=>{setFilter({t:"all"});render(q);};return;}
  saveRecent(q); show(res.list[0][0],res,noPush);
}
// ---- home: the search field alone, centred
function showHome(push){setView({t:"home"});LAST=null;$("out").innerHTML="";$("q").value="";
  if(push){try{history.pushState({home:1},"",location.pathname+location.search);}catch(e){}}
  showSugg();window.scrollTo(0,0);try{$("q").focus({preventScroll:true});}catch(e){}}
// recent searches: quiet suggestions only while the field is focused and empty on the home screen
function showSugg(){const el=$("sugg"),q=$("q");const r=getRecent().slice(0,4);
  const on=VIEW&&VIEW.t==="home"&&!q.value&&document.activeElement===q&&r.length;
  el.innerHTML=on?r.map((x,i)=>`<a data-i="${i}">${esc(x)}</a>`).join(""):"";el.classList.toggle("on",!!on);}
$("sugg").addEventListener("pointerdown",e=>e.preventDefault());
$("sugg").addEventListener("mousedown",e=>e.preventDefault());
$("sugg").addEventListener("click",e=>{const a=e.target.closest("[data-i]");if(!a)return;const v=getRecent()[+a.dataset.i];$("q").value=v;render(v);});
function getRecent(){return jget("bl_recent",[]);}
function saveRecent(q){q=q.trim();if(!q)return;let r=getRecent().filter(x=>x!==q);r.unshift(q);r=r.slice(0,8);jset("bl_recent",r);}
function setFs(px){px=Math.max(14,Math.min(30,px));document.documentElement.style.setProperty("--fs",px+"px");try{localStorage.setItem("bl_fs",px);}catch(e){}}
setFs(+(localStorage.getItem("bl_fs")||18));
function curFs(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||18;}
const Q=$("q");
Q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();render(Q.value);}else if(e.key==="Escape"){showHome(true);}});
Q.addEventListener("input",()=>{if(!Q.value&&VIEW&&VIEW.t!=="home")showHome(true);else showSugg();});
Q.addEventListener("focus",()=>{if(VIEW&&VIEW.t!=="home"&&Q.value)setTimeout(()=>{try{Q.select();}catch(e){}},0);showSugg();});
Q.addEventListener("blur",()=>setTimeout(showSugg,150));
// ---- word meaning (tap an original word)
function showPop(i,el){document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));el.classList.add("on");
  const [w,g,gray,m,sn]=CUR[i];const lx=sn?((DATA.lex||{})[sn]||""):"";
  openSheet(`<div class="wd"><div class="o">${esc(w)}</div><div class="row">${esc(g||"—")}</div>`+
    `<div class="lbl">Other meanings</div><div class="row">${esc(gray||"none listed")}</div>`+
    `<div class="lbl">Parsing</div><div class="row">${esc(m||"—")}</div>`+
    (sn?`<div class="lbl">Root word</div><div class="row">${esc(lx||sn)} · ${sn}</div>`:"")+`</div><div class="gap"></div>`+
    (sn?it(`id="study"`,"Word study")+it(`id="findr"`,"Every verse with this root"):"")+it(`id="findw"`,"Same spelling"),"word");
  $("findw").onclick=()=>{closeSheet();$("q").value=w;render(w);};
  if(sn){$("findr").onclick=()=>{closeSheet();const q="root "+sn;$("q").value=q;render(q);};$("study").onclick=()=>showStudy(sn);}}
function hidePop(){if(SHEETKIND==="word")closeSheet();document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));}
// ---- taps
let SUPPRESS=0;
document.addEventListener("click",e=>{
  if(Date.now()-SUPPRESS<450){e.preventDefault();e.stopPropagation();return;}
  if(e.target.closest("#sheet,#top,#corner"))return;
  const t=e.target;
  const w=t.closest(".w");if(w){showPop(+w.dataset.i,w);return;}
  const pg=t.closest("[data-pgo]");if(pg){e.preventDefault();openFromList(pg.dataset.pgo);return;}
  const go=t.closest("[data-go]");if(go){e.preventDefault();if(VIEW.t==="chapter")show(go.dataset.go);else show(go.dataset.go,LAST&&LAST.list&&(LAST.list.some(x=>x[0]===go.dataset.go)||(LAST.more&&LAST.more.items.includes(go.dataset.go)))?LAST:undefined);return;}
  if(t.closest("[data-chap]")){showChapter(VIEW.ref);return;}
  const st=t.closest("[data-study]");if(st){showStudy(st.dataset.study);return;}
  if(t.closest(".vt")){toggleIl();return;}
  if(t.closest("a,.li,.link,.study,.il,.xr,.chap p"))return;
  // empty background: home
  if(VIEW&&VIEW.t!=="home"&&VIEW.t!=="busy"&&!window.getSelection().toString())showHome(true);
},true);
document.addEventListener("keydown",e=>{if(e.target.id==="q"||!VIEW||VIEW.t!=="verse")return;if(e.key==="ArrowLeft"){const p=step(VIEW.ref,-1);if(p)show(p,LAST);}if(e.key==="ArrowRight"){const n=step(VIEW.ref,1);if(n)show(n,LAST);}});
// ---- gestures: long-press, swipes, left-edge back, corner
(()=>{let sx=0,sy=0,st=0,lp=0,fired=false,two=false,tgt=null;
  const LPZ=".vt,.verse,.chap,#phl,.li,.il";
  const clear=()=>{clearTimeout(lp);lp=0;};
  const fire=fn=>{fired=true;SUPPRESS=Date.now();try{window.getSelection().removeAllRanges();}catch(e){}if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}fn();};
  document.addEventListener("touchstart",e=>{fired=false;tgt=e.target;
    if(e.touches.length===2){clear();const a=e.touches[0],b=e.touches[1];two=a.clientX>innerWidth/2&&b.clientX>innerWidth/2&&a.clientY<innerHeight*.3&&b.clientY<innerHeight*.3;st=0;return;}
    two=false;if(e.touches.length!==1)return;const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now();clear();
    if($("sheet").style.display==="flex"||!tgt.closest)return;
    if(tgt.closest("#corner"))lp=setTimeout(()=>fire(settingsSheet),500);
    else if(VIEW&&VIEW.t!=="home"&&tgt.closest(LPZ)&&!tgt.closest(".il .w,.xr a"))lp=setTimeout(()=>fire(trSheet),500);
  },{passive:true});
  document.addEventListener("touchmove",e=>{if(!lp)return;const p=e.touches[0];if(p&&Math.hypot(p.clientX-sx,p.clientY-sy)>10)clear();},{passive:true});
  document.addEventListener("touchcancel",()=>{clear();st=0;},{passive:true});
  document.addEventListener("touchend",e=>{clear();
    if(two){two=false;if(e.touches.length===0){SUPPRESS=Date.now();settingsSheet();}return;}
    if(fired){if(e.cancelable)e.preventDefault();fired=false;st=0;return;}
    if(!VIEW||!st||$("sheet").style.display==="flex")return;const p=e.changedTouches[0];const dx=p.clientX-sx,dy=p.clientY-sy,dt=Date.now()-st;st=0;
    if(!tgt||!tgt.closest||tgt.closest("#top,#corner"))return;
    const ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>=70&&ay<ax*.6&&dt<900){
      if(sx<24&&dx>0&&history.state&&history.length>1){SUPPRESS=Date.now();history.back();return;}
      const d=dx<0?1:-1;
      if(VIEW.t==="verse"){const r=step(VIEW.ref,d);if(r){SUPPRESS=Date.now();show(r,LAST);}}
      else if(VIEW.t==="chapter"){const m=chapterOf(VIEW.ref).match(/^(.*) (\d+)$/);const r=`${m[1]} ${+m[2]+d}:1`;if(hasRef(r)){SUPPRESS=Date.now();showChapter(r,VIEW.tn,VIEW.tn2);window.scrollTo(0,0);}}
      return;}
    // swipe up on the verse when there's nothing more to scroll: open the chapter
    if(dy<=-90&&ax<ay*.6&&dt<900&&VIEW.t==="verse"&&tgt.closest(".verse")&&window.scrollY+innerHeight>=document.documentElement.scrollHeight-4){SUPPRESS=Date.now();showChapter(VIEW.ref);}
  },{passive:false});
  // mouse / desktop: right-click does what a long-press does
  document.addEventListener("contextmenu",e=>{const t=e.target;if(!t.closest)return;
    if(t.closest("#corner")){e.preventDefault();settingsSheet();return;}
    if(VIEW&&VIEW.t!=="home"&&t.closest(LPZ)){e.preventDefault();trSheet();}});
})();
// ---- background loading
function note(t){const e=$("loadnote");e.textContent=t;e.style.display=t?"block":"none";}
function progress(){const n=trLoaded().length,N=DATA.order.length;note(n<N||!LOADED.has("il")?`Loading ${n} of ${N} translations`:"");}
function refreshMaybe(){if(!VIEW)return;if($("sheet").style.display==="flex")return;
  if(VIEW.t==="verse"){const y=window.scrollY;show(VIEW.ref,LAST,true,true);window.scrollTo(0,y);}}
let FAILNOTE=false;
HOOK=(k,d)=>{
  if(k==="idx"){idxMsg(d);return;}
  if(k==="ilpart"){if(VIEW&&VIEW.t==="verse"&&VIEW.hlwait&&isHl(VIEW.ref))refreshMaybe();progress();return;}
  if(k==="fail"){note("");if(!FAILNOTE){FAILNOTE=true;toast("Part of the Bible couldn't download. Open the page again when you're online.");}return;}
  if(k==="done"){note("");window.__blAll=true;idleBuild();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}refreshMaybe();return;}
  if(IWFAIL){if(DATA.order.includes(k)){INDEX=null;delete BST.w;FCACHE.clear();XCACHE.clear();}if(k==="il"){OINDEX=null;RINDEX=null;delete BST.o;delete BST.r;}}
  if(k===phTr()){phIdle(k);if(k!=="HLIT"||(VIEW&&VIEW.hlwait))refreshMaybe();}
  progress();if(k==="il"&&ILON)refreshMaybe();
};
// copying selected text gives normal hyphens back
document.addEventListener("copy",e=>{try{const s=String(window.getSelection());if(s.includes("\u2011")&&e.clipboardData){e.clipboardData.setData("text/plain",s.replace(/\u2011/g,"-"));e.preventDefault();}}catch(_){}});
applyTheme();
try{history.scrollRestoration="manual";}catch(e){}
window.addEventListener("popstate",e=>{const s=e.state||{};closeSheet();if(s.pq){$("q").value=s.pq;render(s.pq,true);return;}
  if(s.id&&CTXS.has(s.id)&&hasRef(s.ref)){show(s.ref,CTXS.get(s.id),true);return;}
  const r=s.ref||decodeURIComponent(location.hash.slice(1));if(r&&hasRef(r))show(r,undefined,true);else if(!r)showHome();});
const startRef=decodeURIComponent(location.hash.slice(1));
if(startRef&&hasRef(startRef)){$("q").value=refName(startRef);show(startRef,undefined,true);} else if(/^["“]/.test(startRef)){$("q").value=startRef;render(startRef,true);} else showHome();
if(FILES)progress();
while(IWQ.length)idxMsg(IWQ.shift());
phIdle(phTr());
if(!FILES){window.__blAll=true;idleBuild();}
window.BL={showStudy,ph:()=>Object.keys(PH),phraseHits:(n,q)=>{const w=phraseQuery(q).words;if(!PH[n])phStep(n,0);return phraseHits(n,w,{t:'all'}).ids.length;},getLast:()=>LAST,view:()=>VIEW,idx:()=>({worker:!IWFAIL,done:IWDONE,ntr:INDEXNTR,o:!!OINDEX,r:!!RINDEX}),sheet:()=>SHEETKIND,mm:()=>MMS?{shown:MMS.shown,left:mmLeft(),items:MMS.ctx.more?MMS.ctx.more.items.length:0,done:MMS.ctx.more?MMS.ctx.more.done:true,t:MMT.slice()}:null,hl:()=>({ms:Math.round(HLMS*10)/10,loaded:LOADED.has("HLIT"),n:Object.keys(DATA.tr.HLIT||{}).length})};
window.__blReady=true;
}
</script>
